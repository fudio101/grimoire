version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # react-table v9 renames the row-model factories and drops the 1-arg
      # ColumnDef generic; migrate it in its own PR, not inside a group bump.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
