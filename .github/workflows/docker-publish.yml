name: Docker Publish

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not `type=local`. This ran on the self-hosted
          # runner as local cache under /tmp — which is a 2GB *tmpfs*, so the
          # cache sat in RAM, unreclaimable (tmpfs pages need swap to be
          # evicted, and this box has none), until the next reboot. With
          # mode=max that includes the builder stage's whole node_modules
          # layer; node_modules alone is 1.1GB.
          #
          # Worse, the rotate step below it wrote `-new` while `cache-from`
          # still read the old directory, so at peak *two* full caches were
          # resident at once, and only afterwards was the old one deleted.
          # That is a rotate scheme that needs double the space of the thing
          # it is rotating, on the resource the box has least of.
          #
          # Pushing the cache to GHCR instead costs the runner nothing —
          # no RAM, and no disk either, which matters at 88% full. It also
          # survives a runner reinstall, and deletes the rotate step: the
          # registry overwrites the tag in place, so there is no old copy to
          # keep alive while the new one is written.
          #
          # `buildcache` shows up as a tag on the package alongside the
          # version tags. It is a cache manifest, not a runnable image.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
