name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create Release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # PAT required so that the release event triggers downstream
          # workflows (docker-publish). GITHUB_TOKEN cannot trigger
          # new workflow runs.
          token: ${{ secrets.PAT_TOKEN }}
