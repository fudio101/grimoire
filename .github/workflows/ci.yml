name: CI

on:
  # No `branches:` filter — this repo delivers stacked PRs (each based on the
  # previous PR's branch, not on `main`), and `branches:` filters on the PR's
  # *base* ref. Scoping this to `[main]` silently skipped CI on every PR in a
  # stack except the bottom one — discovered when PRs #91-94 all showed an
  # empty status-check list on GitHub despite passing every check locally.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        # Node 25+ no longer bundles corepack, so install it before enabling.
        run: npm i -g corepack@latest && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          STORE_DIR: /tmp/.pnpm-store-grimoire

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build (Vite)
        # No DATABASE_URL: `vite build` never evaluates application modules,
        # so this build does not open the database. Still the primary build
        # until PR 9 retires it — see "Build (Next.js)" below for the build
        # that actually exercises hazard 1.
        run: pnpm run build

      - name: Build (Next.js)
        # No DATABASE_URL here either, but this build does not get the same
        # free pass: `next build` evaluates every page module during
        # "Collecting page data", unlike `vite build`. `src/lib/db/index.ts`'s
        # lazy connection (PR 1) plus `src/instrumentation.ts` skipping
        # migrations during NEXT_PHASE=phase-production-build are what make
        # the next check pass.
        run: pnpm run build:next

      - name: Next.js build never opened the database
        run: test ! -f data.db

      - name: Route tree is up to date
        # src/routeTree.gen.ts is generated but committed, so that tsc can run
        # before the build on a clean checkout. The build regenerates it, so
        # diffing afterwards catches a route added or renamed without the tree
        # committed alongside — otherwise tsc passes against a stale tree.
        #
        # This has to use the build rather than the standalone `tsr generate`
        # CLI: the CLI omits the `declare module "@tanstack/react-start"` block
        # that the Start plugin appends, so its output differs from the
        # committed file even when nothing changed.
        run: git diff --exit-code src/routeTree.gen.ts
