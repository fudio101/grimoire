name: CI

on:
  # No `branches:` filter — this repo delivers stacked PRs (each based on the
  # previous PR's branch, not on `main`), and `branches:` filters on the PR's
  # *base* ref. Scoping this to `[main]` silently skipped CI on every PR in a
  # stack except the bottom one — discovered when PRs #91-94 all showed an
  # empty status-check list on GitHub despite passing every check locally.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 20
    env:
      # This runner is a small, real box (3.8GB RAM, zero swap — any spike
      # past available memory is an instant OOM-kill, not graceful paging),
      # and it hosts production alongside CI.
      #
      # glibc's default per-thread arena allocator can multiply a process's
      # RSS several times over on Linux for the same workload that looks
      # modest on macOS (each thread gets its own arena that never fully
      # shrinks). Kept because `next build` is Turbopack — its memory is
      # allocated natively, which is exactly what this caps; a JS-heap knob
      # is not (see below).
      MALLOC_ARENA_MAX: "2"
      #
      # NODE_OPTIONS=--max-old-space-size was here and has been removed: it
      # did nothing for this build, and reading it as a memory guard is what
      # made a real OOM look already-handled. Measured, same machine, one
      # variable:
      #
      #   cap 1536 -> peak RSS 1686MB    cap 512 -> peak RSS 1684MB
      #   cap  768 -> peak RSS 1562MB    cap 384 -> V8 heap OOM, RSS 1697MB
      #
      # RSS is flat, because `next build` runs Turbopack (Rust) and its
      # memory lives outside the V8 heap that flag bounds. Lowering the cap
      # only starves the JS half until it dies while RSS never moves. Next's
      # own docs/01-app/02-guides/memory-usage.md is entirely webpack knobs —
      # none of them apply to a Turbopack build either.
      #
      # The build needs ~1.6GB for ~20s and there is no knob that changes
      # that. What decides whether it survives is how much the box has free
      # at that moment, which is a property of the box, not of this file.
      # The one thing CI was doing to make that worse — a BuildKit cache
      # written into /tmp, which is a tmpfs on this runner — is fixed in
      # docker-publish.yml in this same change.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        # Node 25+ no longer bundles corepack, so install it before enabling.
        run: npm i -g corepack@latest && corepack enable

      - name: Install dependencies
        # No `STORE_DIR:` here any more. It used to be set to
        # /tmp/.pnpm-store-grimoire and was a no-op the whole time: pnpm
        # takes its store location from `--store-dir`, a `store-dir=` entry
        # in .npmrc, or the `pnpm-workspace.yaml` setting — never from an
        # env var of that name. Verified by probing pnpm directly:
        #
        #   pnpm store path --store-dir=/tmp/probe  -> /tmp/probe/v11
        #   STORE_DIR=/tmp/probe pnpm store path    -> unchanged default
        #   npm_config_store_dir=... pnpm store path -> unchanged default
        #
        # So the store has always been at pnpm's default path on disk, never
        # in the tmpfs. Deleting the line changes no behaviour; keeping it
        # would keep implying a control that does not exist, which is how it
        # ended up being treated as an explanation during the OOM hunt.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        # `pnpm run typecheck` = `next typegen && tsc --noEmit`. The typegen
        # half matters on its own: tsconfig.json's `include` covers
        # `.next/types/**/*.ts`, which is what makes `redirect()`/
        # `router.push()`/`router.replace()` calls checked against real
        # routes. That directory is only ever written by `next build` or
        # `next typegen` — never by tsc itself — and this runner's
        # `clean: false` checkout leaves `.next` (gitignored, so checkout
        # doesn't touch it) untouched between jobs. Without running typegen
        # first, tsc would silently validate against whatever `.next/types`
        # some unrelated prior job happened to leave on disk, not the commit
        # actually being tested — a real incident: it flagged a perfectly valid
        # `redirect("/login")` as invalid because a stale, pre-login-page
        # `.next/types` from an earlier run was still sitting there.
        run: pnpm run typecheck

      - name: Test
        # The migration test that seeds from grimoire-data.tar.gz (the real
        # production snapshot) is gitignored and never reaches this
        # checkout, so it self-skips here via `it.skipIf` rather than
        # failing on a fixture this runner was never going to have. Every
        # other test — including the equivalent baseline scenario built
        # from the committed migration SQL itself — still runs for real.
        run: pnpm run test

      - name: Audit dependencies
        # Baseline, not a fix — `pnpm audit` is clean as of this step's
        # introduction. Catches a known-vulnerable transitive dep landing via
        # a routine dependency bump before it reaches a tagged release.
        run: pnpm audit --audit-level=high

      - name: Build
        # `next build` evaluates every page module during "Collecting page
        # data", so this exercises hazard 1's fix for real — the lazy SQLite
        # connection (PR 1), `instrumentation.ts` skipping migrations during
        # NEXT_PHASE=phase-production-build, and `force-dynamic` on the root
        # layout (PR 7) are what make the next step pass. `next build`'s own
        # internal type-check runs against the same tsconfig.json the plain
        # tsc step above uses.
        run: pnpm run build

      - name: Build never opened the database
        run: test ! -f data.db
