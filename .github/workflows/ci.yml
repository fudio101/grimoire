name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        # Node 25+ no longer bundles corepack, so install it before enabling.
        run: npm i -g corepack@latest && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          STORE_DIR: /tmp/.pnpm-store-grimoire

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        # No DATABASE_URL: `next build` used to evaluate page modules and open
        # SQLite, but `vite build` never evaluates application code. If this
        # step ever fails on the database, something is being run at build time
        # that should not be.
        run: pnpm run build

      - name: Route tree is up to date
        # src/routeTree.gen.ts is generated but committed, so that tsc can run
        # before the build on a clean checkout. The build regenerates it, so
        # diffing afterwards catches a route added or renamed without the tree
        # committed alongside — otherwise tsc passes against a stale tree.
        #
        # This has to use the build rather than the standalone `tsr generate`
        # CLI: the CLI omits the `declare module "@tanstack/react-start"` block
        # that the Start plugin appends, so its output differs from the
        # committed file even when nothing changed.
        run: git diff --exit-code src/routeTree.gen.ts
