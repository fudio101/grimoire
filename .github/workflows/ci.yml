name: CI

on:
  # No `branches:` filter — this repo delivers stacked PRs (each based on the
  # previous PR's branch, not on `main`), and `branches:` filters on the PR's
  # *base* ref. Scoping this to `[main]` silently skipped CI on every PR in a
  # stack except the bottom one — discovered when PRs #91-94 all showed an
  # empty status-check list on GitHub despite passing every check locally.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        # Node 25+ no longer bundles corepack, so install it before enabling.
        run: npm i -g corepack@latest && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          STORE_DIR: /tmp/.pnpm-store-grimoire

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        # `pnpm run build` is `next build` as of this PR — Vite is retired
        # from the primary scripts (query-options.ts's queryFns now fetch
        # app/api/* Route Handlers that only exist under Next, so the old
        # TanStack Router surface can no longer run correctly regardless of
        # whether it still compiles; see src/routes/** in tsconfig.json's
        # exclude list). No DATABASE_URL: unlike `vite build`, `next build`
        # evaluates every page module during "Collecting page data", so this
        # exercises hazard 1's fix for real — the lazy SQLite connection
        # (PR 1) plus `instrumentation.ts` skipping migrations during
        # NEXT_PHASE=phase-production-build are what make the next step
        # pass. `next build`'s own internal type-check runs against
        # tsconfig.next.json (see `typescript.tsconfigPath`), separately
        # from the plain tsc step above.
        run: pnpm run build

      - name: Build never opened the database
        run: test ! -f data.db
