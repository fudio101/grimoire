name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          STORE_DIR: /tmp/.pnpm-store-grimoire

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        # The self-hosted runner checks out with `clean: false`, so a previous
        # run's generated route types in `.next` persist. After a route rename
        # they still reference the old path and fail tsc. Drop the stale
        # generated types first; the Build step regenerates them.
        run: |
          rm -rf .next/types .next/dev/types
          pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
        env:
          # Use a temp SQLite DB for CI build — better-sqlite3 auto-creates it
          DATABASE_URL: ./ci-build.db
